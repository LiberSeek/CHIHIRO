<!doctype html>
<html lang="zh-CN" data-theme="dark" data-theme-mode="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>千寻IM - 千人千面, 千域千寻</title>
  <script>
    (function () {
      var mode = 'dark'
      try { mode = localStorage.getItem('chihiro-theme') || 'dark' } catch (e) {}
      if (mode !== 'light' && mode !== 'dark' && mode !== 'system') mode = 'dark'
      var resolved = mode === 'system'
        ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : mode
      document.documentElement.dataset.theme = resolved
      document.documentElement.dataset.themeMode = mode
    })()
  </script>
  <meta name="theme-color" content="#1c1c1e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="千寻" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <nav class="rail" aria-label="账号">
    <div id="account-list" class="account-list"></div>
    <button id="btn-add" class="rail-btn add" title="添加账号" type="button">+</button>
    <div class="rail-space" aria-hidden="true"></div>
    <button id="btn-theme" class="rail-btn theme" title="浅色" type="button" aria-label="主题：浅色">
      <svg class="theme-ico theme-ico-light" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <circle cx="12" cy="12" r="4" fill="currentColor"/>
        <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M12 3.2v1.8M12 19v1.8M3.2 12h1.8M19 12h1.8M6.05 6.05l1.27 1.27M16.68 16.68l1.27 1.27M6.05 17.95l1.27-1.27M16.68 7.32l1.27-1.27"/>
        </g>
      </svg>
      <svg class="theme-ico theme-ico-dark" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path fill="currentColor" d="M21.75 15a9.72 9.72 0 0 1-3.75.75c-5.39 0-9.75-4.36-9.75-9.75 0-1.33.27-2.6.75-3.75A9.75 9.75 0 1 0 21.75 15z"/>
      </svg>
      <svg class="theme-ico theme-ico-system" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <rect x="3.5" y="4.5" width="17" height="11.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M8 19.5h8M12 16v3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
    <button id="btn-settings" class="rail-btn gear" title="设置" type="button" aria-haspopup="menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path fill="currentColor" d="M4.75 6.5h14.5a.75.75 0 0 1 0 1.5H4.75a.75.75 0 0 1 0-1.5zm0 4.75h14.5a.75.75 0 0 1 0 1.5H4.75a.75.75 0 0 1 0-1.5zm0 4.75h14.5a.75.75 0 0 1 0 1.5H4.75a.75.75 0 0 1 0-1.5z"/>
      </svg>
    </button>
  </nav>

  <div id="workspace" class="workspace" data-feature="off">
    <section id="stage" class="stage">
      <div id="empty" class="panel empty-panel">
        <div class="empty-copy">
          <div class="empty-title">
            <img class="empty-logo" src="/icon.png" alt="" />
            <h1>千寻</h1>
          </div>
          <p class="empty-tagline">千人千面, 千域千寻</p>
          <div class="launch-row">
            <div id="client-dropdown" class="client-dropdown">
              <button id="client-drop-btn" type="button" class="client-drop-btn" aria-haspopup="listbox" aria-expanded="false">
                <span id="client-drop-icon" class="client-drop-icon">QQ</span>
                <span id="client-drop-label">QQ</span>
                <svg class="client-drop-caret" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                  <path fill="currentColor" d="M4.2 6.2a.75.75 0 0 1 1.06 0L8 8.94l2.74-2.74a.75.75 0 1 1 1.06 1.06l-3.27 3.27a.75.75 0 0 1-1.06 0L4.2 7.26a.75.75 0 0 1 0-1.06z"/>
                </svg>
              </button>
              <div id="client-drop-menu" class="client-drop-menu hidden" role="listbox"></div>
            </div>
            <button id="btn-launch" type="button" class="btn launch-btn">启动</button>
          </div>
        </div>
      </div>

      <div id="login" class="panel hidden">
        <h1>登录 QQ</h1>
        <p class="login-brand">千寻IM - 千人千面, 千域千寻</p>
        <ol id="login-steps" class="login-steps hidden"></ol>
        <p id="login-msg" class="login-status hidden">正在准备二维码…</p>
        <img id="qr" class="qr hidden" alt="登录二维码" />
        <p id="qr-hint" class="hint hidden">请使用 QQ 扫描二维码。约两分钟有效。</p>
        <div id="login-qr-actions" class="login-dead hidden">
          <button id="btn-qr-refresh" type="button" class="btn">刷新二维码</button>
        </div>
        <button id="login-cancel" class="btn ghost hidden" type="button">取消</button>
        <div id="login-dead" class="login-dead hidden">
          <button id="btn-dead-remove" type="button" class="btn ghost">退出账号</button>
          <button id="btn-dead-relogin" type="button" class="btn">重新登录</button>
        </div>
      </div>

      <div id="leaving" class="panel leaving-panel hidden">
        <div class="leaving-copy">
          <div class="leaving-spinner" aria-hidden="true"></div>
          <p id="leaving-title" class="leaving-title">正在退出账号</p>
          <p id="leaving-hint" class="hint">请稍候…</p>
        </div>
      </div>

      <div id="im-host" class="im hidden"></div>
    </section>
  </div>

  <div id="dash-drawer" class="dash-overlay hidden" aria-hidden="true">
    <div class="dash-window" role="dialog" aria-modal="true">
      <header class="dash-head">
        <strong id="dash-title">设置</strong>
        <span id="dash-hint" class="dash-hint"></span>
        <button id="btn-dash-close" type="button" class="btn ghost">关闭</button>
      </header>
      <iframe id="dash-frame" class="dash-frame" title="设置"></iframe>
    </div>
  </div>

  <div id="account-menu" class="account-menu hidden">
    <button id="menu-remove" type="button" class="danger">退出账号</button>
  </div>

  <div id="settings-menu" class="account-menu settings-menu hidden" role="menu">
    <button id="menu-napcat" type="button" role="menuitem">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <path fill="currentColor" d="M5.4 9.1 7.2 4.6a.8.8 0 0 1 1.45.22L9.5 7.4A7 7 0 0 1 12 7c.87 0 1.7.14 2.5.4l.85-2.58A.8.8 0 0 1 16.8 4.6l1.8 4.5c.6 1.15.9 2.4.9 3.7 0 3.9-3.36 7-7.5 7s-7.5-3.1-7.5-7c0-1.3.3-2.55.9-3.7z"/>
      </svg>
      <span>NapCat 设置</span>
    </button>
    <button id="menu-astrbot" type="button" role="menuitem">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <path fill="currentColor" fill-rule="evenodd" d="M12 3.2a.9.9 0 0 1 .9.9V6h3.4A2.7 2.7 0 0 1 19 8.7v7.6A2.7 2.7 0 0 1 16.3 19H7.7A2.7 2.7 0 0 1 5 16.3V8.7A2.7 2.7 0 0 1 7.7 6H11.1V4.1a.9.9 0 0 1 .9-.9zM9.4 11.2a1.4 1.4 0 1 0 0 2.8 1.4 1.4 0 0 0 0-2.8zm5.2 0a1.4 1.4 0 1 0 0 2.8 1.4 1.4 0 0 0 0-2.8z"/>
      </svg>
      <span>AstrBot 设置</span>
    </button>
    <button id="menu-im-settings" type="button" role="menuitem">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <path fill="currentColor" fill-rule="evenodd" d="M11.1 3.6c.2-.8 1.6-.8 1.8 0l.35 1.42a7.2 7.2 0 0 1 1.86.76l1.36-.6c.76-.34 1.56.46 1.22 1.22l-.6 1.36c.32.58.57 1.2.76 1.86l1.42.35c.8.2.8 1.6 0 1.8l-1.42.35a7.2 7.2 0 0 1-.76 1.86l.6 1.36c.34.76-.46 1.56-1.22 1.22l-1.36-.6a7.2 7.2 0 0 1-1.86.76l-.35 1.42c-.2.8-1.6.8-1.8 0l-.35-1.42a7.2 7.2 0 0 1-1.86-.76l-1.36.6c-.76.34-1.56-.46-1.22-1.22l.6-1.36a7.2 7.2 0 0 1-.76-1.86L3.6 12.9c-.8-.2-.8-1.6 0-1.8l1.42-.35a7.2 7.2 0 0 1 .76-1.86l-.6-1.36c-.34-.76.46-1.56 1.22-1.22l1.36.6a7.2 7.2 0 0 1 1.86-.76L11.1 3.6zM12 9.2a2.8 2.8 0 1 0 0 5.6 2.8 2.8 0 0 0 0-5.6z"/>
      </svg>
      <span>设置</span>
    </button>
  </div>

  <div id="confirm-dialog" class="modal hidden" aria-hidden="true">
    <div class="sheet confirm-sheet" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <h2 id="confirm-title">退出账号</h2>
      <p id="confirm-body" class="hint"></p>
      <div class="row">
        <button id="confirm-cancel" type="button" class="btn ghost">取消</button>
        <button id="confirm-ok" type="button" class="btn danger">退出账号</button>
      </div>
    </div>
  </div>

  <div id="modal" class="modal hidden">
    <div class="sheet">
      <h2>添加账号</h2>
      <label>
        客户端
        <select id="client-select"></select>
      </label>
      <p id="client-hint" class="hint"></p>
      <div class="row">
        <button id="modal-cancel" type="button" class="btn ghost">取消</button>
        <button id="modal-ok" type="button" class="btn">开始登录</button>
      </div>
    </div>
  </div>

  <script src="/app.js" type="module"></script>
</body>
</html>
