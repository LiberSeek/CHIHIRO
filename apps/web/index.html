<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>千寻IM - 千人千面, 千与千寻</title>
  <meta name="theme-color" content="#111111" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="千寻" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-accounts">
      <div id="account-list" class="account-list"></div>
      <button id="btn-add" class="rail-btn add" title="添加账号">+</button>
    </div>
  </header>

  <div id="workspace" class="workspace">
    <section id="stage" class="stage">
      <div id="empty" class="panel empty-panel">
        <div class="empty-copy">
          <div class="empty-title">
            <img class="empty-logo" src="/icon.png" alt="" />
            <h1>千寻</h1>
          </div>
          <p class="empty-tagline">千人千面, 千与千寻</p>
          <div class="launch-row">
            <div id="client-dropdown" class="client-dropdown">
              <button id="client-drop-btn" type="button" class="client-drop-btn" aria-haspopup="listbox" aria-expanded="false">
                <span id="client-drop-icon" class="client-drop-icon">QQ</span>
                <span id="client-drop-label">QQ</span>
                <svg class="client-drop-caret" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                  <path fill="currentColor" d="M4.2 6.2a.75.75 0 0 1 1.06 0L8 8.94l2.74-2.74a.75.75 0 1 1 1.06 1.06l-3.27 3.27a.75.75 0 0 1-1.06 0L4.2 7.26a.75.75 0 0 1 0-1.06z"/>
                </svg>
              </button>
              <div id="client-drop-menu" class="client-drop-menu hidden" role="listbox"></div>
            </div>
            <button id="btn-launch" type="button" class="btn launch-btn">启动</button>
          </div>
        </div>
      </div>

      <div id="login" class="panel hidden">
        <h1>登录 QQ</h1>
        <p class="login-brand">千寻IM - 千人千面, 千与千寻</p>
        <ol id="login-steps" class="login-steps hidden"></ol>
        <p id="login-msg" class="login-status hidden">正在准备二维码…</p>
        <img id="qr" class="qr hidden" alt="登录二维码" />
        <p id="qr-hint" class="hint hidden">请使用 QQ 扫描二维码, 约两分钟有效。</p>
        <button id="login-cancel" class="btn ghost hidden" type="button">取消这次登录</button>
      </div>

      <div id="leaving" class="panel leaving-panel hidden">
        <div class="leaving-copy">
          <div class="leaving-spinner" aria-hidden="true"></div>
          <p class="leaving-title">正在退出账号</p>
          <p class="hint">请稍候…</p>
        </div>
      </div>

      <div id="im-host" class="im hidden"></div>
    </section>

    <aside id="feature" class="feature is-agentic hidden" aria-hidden="true">
      <nav id="feature-tabs" class="feature-tabs">
        <button type="button" data-tab="agentic" class="is-on">Agentic Bot</button>
        <span id="agentic-status" class="agentic-hosted">未托管</span>
        <span class="feature-tabs-spacer" aria-hidden="true"></span>
        <label class="agentic-switch" title="接管当前 QQ">
          <input id="agentic-switch" type="checkbox" />
          <span class="agentic-switch-ui"></span>
        </label>
      </nav>
      <div id="pane-agentic" class="feature-pane">
        <div id="agentic-list" class="agentic-list is-empty">
          <p class="agentic-empty">暂无会话/任务</p>
        </div>
        <div id="agentic-detail" class="agentic-detail hidden">
          <div class="agentic-detail-bar">
            <button id="agentic-back" type="button" class="btn ghost">返回</button>
            <div id="agentic-peer" class="agentic-peer"></div>
          </div>
          <div id="agentic-thread" class="agentic-thread"></div>
          <div id="agentic-drafts" class="agentic-drafts"></div>
          <div class="agentic-composer">
            <div id="agentic-quote" class="agentic-quote hidden">
              <span id="agentic-quote-text" class="agentic-quote-text"></span>
              <button type="button" id="agentic-quote-clear" class="agentic-quote-clear" title="取消引用">×</button>
            </div>
            <textarea id="agentic-input" placeholder="给 Bot 发送消息" rows="2"></textarea>
            <div class="agentic-composer-bar">
              <div class="agentic-perm">
                <button type="button" id="agentic-perm-btn" class="agentic-perm-btn is-always" title="回复权限">
                  <span class="agentic-perm-ico" aria-hidden="true">!</span>
                  <span id="agentic-perm-label">完全访问</span>
                </button>
                <div id="agentic-perm-menu" class="agentic-perm-menu hidden" role="menu">
                  <button type="button" data-mode="ask" role="menuitem">
                    <span class="agentic-perm-ico">✋</span>
                    <span>
                      <strong>请求批准</strong>
                      <small>每条 Bot 回复都先给你确认</small>
                    </span>
                  </button>
                  <button type="button" data-mode="auto" role="menuitem">
                    <span class="agentic-perm-ico">🛡</span>
                    <span>
                      <strong>帮我批准</strong>
                      <small>仅对链接、图片、@全体询问</small>
                    </span>
                  </button>
                  <button type="button" data-mode="always" role="menuitem">
                    <span class="agentic-perm-ico">!</span>
                    <span>
                      <strong>完全访问</strong>
                      <small>回复直接发给对方，不再询问</small>
                    </span>
                  </button>
                </div>
              </div>
              <div class="agentic-composer-actions">
                <button id="agentic-ask" type="button" class="agentic-send-bot" title="问 Bot">
                  <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                    <path fill="currentColor" d="M8 12.8a.75.75 0 0 1-.75-.75V5.86L5.03 8.08a.75.75 0 1 1-1.06-1.06l3.5-3.5a.75.75 0 0 1 1.06 0l3.5 3.5a.75.75 0 1 1-1.06 1.06L8.75 5.86v6.19A.75.75 0 0 1 8 12.8z"/>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <div id="dash-drawer" class="dash-overlay hidden" aria-hidden="true">
    <div class="dash-window" role="dialog" aria-modal="true">
      <header class="dash-head">
        <strong id="dash-title">设置</strong>
        <span id="dash-hint" class="dash-hint"></span>
        <button id="btn-dash-close" type="button" class="btn ghost">关闭</button>
      </header>
      <iframe id="dash-frame" class="dash-frame" title="设置"></iframe>
    </div>
  </div>

  <div id="account-menu" class="account-menu hidden">
    <button id="menu-remove" type="button" class="danger">退出账号</button>
  </div>

  <div id="confirm-dialog" class="modal hidden" aria-hidden="true">
    <div class="sheet confirm-sheet" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <h2 id="confirm-title">退出账号</h2>
      <p id="confirm-body" class="hint"></p>
      <div class="row">
        <button id="confirm-cancel" type="button" class="btn ghost">取消</button>
        <button id="confirm-ok" type="button" class="btn danger">退出账号</button>
      </div>
    </div>
  </div>

  <div id="modal" class="modal hidden">
    <div class="sheet">
      <h2>添加账号</h2>
      <label>
        客户端
        <select id="client-select"></select>
      </label>
      <p id="client-hint" class="hint"></p>
      <div class="row">
        <button id="modal-cancel" type="button" class="btn ghost">取消</button>
        <button id="modal-ok" type="button" class="btn">开始登录</button>
      </div>
    </div>
  </div>

  <script src="/app.js" type="module"></script>
</body>
</html>
